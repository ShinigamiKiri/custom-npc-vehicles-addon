name: Build and Poll
on: [push]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Gradle
        run: |
          cd sbw_npc_addon
          chmod +x gradlew
          ./gradlew build > ../compile_error.txt 2>&1 || true
      - name: Commit Error
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add compile_error.txt
          git commit -m "Upload compile error" || true
          git push || true
